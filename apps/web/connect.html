<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>連線 AssetAnchor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&family=Nunito:wght@700;800;900&display=swap"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="card" aria-live="polite">
      <header class="brand">
        <span class="logo" aria-hidden="true">A</span>
        <span class="brand-name">AssetAnchor</span>
      </header>

      <section id="view-loading">
        <p class="muted">載入中…</p>
      </section>

      <section id="view-login" hidden>
        <h1>登入以連線 <span class="client-name"></span></h1>
        <p class="muted">使用你在 AssetAnchor App 的帳號登入。</p>
        <button id="google" class="btn btn-secondary" type="button">使用 Google 登入</button>
        <div class="divider"><span>或</span></div>
        <form id="email-form" novalidate>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
          <label for="password">密碼</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
          <p id="login-error" class="error" role="alert" hidden></p>
          <button class="btn btn-primary" type="submit">登入</button>
        </form>
      </section>

      <section id="view-consent" hidden>
        <h1>允許 <span class="client-name"></span> 存取你的 AssetAnchor？</h1>
        <p class="muted">登入身分：<span id="account-email"></span></p>
        <ul class="scopes">
          <li>讀取你的帳戶清單</li>
          <li>讀取你的交易紀錄</li>
          <li>查詢股票代號</li>
          <li>新增、修改、刪除交易（每次都會先在 Claude 對話中列出讓你確認）</li>
        </ul>
        <p class="note">之後可在 Claude 的 connector 設定中移除連線。</p>
        <div class="actions">
          <button id="deny" class="btn btn-secondary" type="button">拒絕</button>
          <button id="allow" class="btn btn-primary" type="button">允許</button>
        </div>
      </section>

      <section id="view-error" hidden>
        <h1>無法完成連線</h1>
        <p id="error-message" class="muted"></p>
      </section>
    </main>
    <script type="module" src="/src/connect.ts"></script>
  </body>
</html>
